name: Build and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            tools/package-lock.json
            web/package-lock.json
      - name: Verify release version
        shell: bash
        run: |
          node -e 'const p=require("./package.json"),a=require("./app/package.json");if(p.version!==a.version)throw Error("Version mismatch");if(process.env.GITHUB_REF_TYPE==="tag"&&process.env.GITHUB_REF_NAME!=="v"+p.version)throw Error("Tag mismatch")'
      - run: npm ci
      - run: npm --prefix app ci
      - run: npm --prefix tools ci
      - run: npm --prefix web ci
      - run: npm test
      - run: npm --prefix web test
      - run: node web/ui.test.mjs
      - run: npm --prefix web run build
      - name: Prepare Windows runtime tools
        if: runner.os == 'Windows'
        run: node scripts/prepare-tools.cjs
      - name: Build Windows EXE
        if: runner.os == 'Windows'
        run: npm run dist
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/nova-launcher-v*.exe
            dist/nova-launcher-v*.AppImage
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish official release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "release/nova-launcher-${RELEASE_TAG}.exe"
          test -f "release/nova-launcher-${RELEASE_TAG}-linux-x86_64.AppImage"
          (cd release && sha256sum *.exe *.AppImage > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release/*.exe release/*.AppImage release/SHA256SUMS.txt --repo "$RELEASE_REPO" --verify-tag --title "Nova Launcher ${RELEASE_TAG}" --notes-file RELEASE_NOTES.md --latest
